<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign in - SkyEye BLE</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='skyeye-ble-logo.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#020617; color:#e5e7eb; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .login-card { width:360px; background:#111827; border:1px solid rgba(75,85,99,0.9); border-radius:8px; padding:22px; box-shadow:0 20px 45px rgba(0,0,0,0.35); }
    .login-brand { text-align:center; margin-bottom:18px; }
    .login-logo { display:block; width:220px; max-width:82%; height:auto; margin:0 auto -4px; }
    h1 { margin:0 0 4px 0; font-size:1.3rem; letter-spacing:0.04em; }
    .product-tag { display:block; color:#38bdf8; font-size:0.72rem; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; }
    p { margin:0 0 18px 0; color:#9ca3af; font-size:0.9rem; }
    label { display:block; margin-top:12px; font-size:0.85rem; color:#cbd5e1; }
    input { width:100%; box-sizing:border-box; margin-top:5px; padding:9px 10px; border-radius:6px; border:1px solid #4b5563; background:#020617; color:#f9fafb; }
    button { width:100%; margin-top:18px; padding:10px; border:none; border-radius:6px; background:#2563eb; color:#fff; cursor:pointer; font-weight:600; }
    .error { background:rgba(239,68,68,0.13); color:#fca5a5; border:1px solid rgba(248,113,113,0.35); padding:8px 10px; border-radius:6px; margin-bottom:12px; font-size:0.85rem; }
  </style>
</head>
<body>
  <form class="login-card" method="post">
    <div class="login-brand">
      <img class="login-logo" src="{{ url_for('static', filename='skyeye-ble-logo.png') }}" alt="SkyEye" />
      <h1>SkyEye</h1>
      <span class="product-tag">BLE Asset Intelligence</span>
    </div>
    <p>Sign in with the account provided by your administrator.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
